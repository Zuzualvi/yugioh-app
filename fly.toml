# fly.toml — Yu-Gi-Oh Edison deck builder
#
# Run `fly launch` on first deploy to register the app and create the
# volume. See docs/working/2026-07-13-DEPLOY.md for the full checklist.
#
# NEVER put secrets here. Use:
#   fly secrets set BOOTSTRAP_ADMIN_USERNAME=... BOOTSTRAP_ADMIN_PASSWORD=...

app = "yugioh-app"          # matches the provision_hosting-created Fly app
primary_region = "ord"      # Chicago — where the provisioned volume/machine live

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[build]
  dockerfile = "Dockerfile"

# ---------------------------------------------------------------------------
# Runtime environment (NON-secret values only)
# ---------------------------------------------------------------------------
[env]
  NODE_ENV    = "production"
  PORT        = "8080"
  DB_PATH     = "/data/yugioh.db"
  IMAGES_PATH = "/data/images"
  # ALLOW_FIXTURE_CATALOG is intentionally NOT set here.
  # The real 3,681-card catalog is baked into the image.
  CORS_ALLOWED_ORIGINS = "https://app.zuhayr.io"
  # Engine asset paths — point to artifacts baked into the image by the Dockerfile.
  EDISON_WASM_PATH     = "/app/engine/vendor/ocgcore-custom.sync.wasm"
  EDISON_CDB_PATH      = "/app/engine/assets/cards.cdb"
  EDISON_SCRIPTS_DIR   = "/app/engine/assets/scripts"
  EDISON_OVERRIDES_DIR = "/app/engine/scripts/edison-overrides"

# ---------------------------------------------------------------------------
# Persistent volume — holds SQLite DB + card images.
# provision_hosting creates the volume server-side; reconcile `source` below to
# the created volume name post-provision if it differs.
# ---------------------------------------------------------------------------
[[mounts]]
  source      = "data"
  destination = "/data"

# ---------------------------------------------------------------------------
# HTTP service
# ---------------------------------------------------------------------------
[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false   # NEVER sleep — wall-clock timers require always-on
  auto_start_machines  = true
  min_machines_running = 1

# Restrict edge TLS to HTTP/1.1 only — do NOT add "h2" here.
# Chrome 121+ uses RFC 8441 extended CONNECT for wss:// when the server
# advertises SETTINGS_ENABLE_CONNECT_PROTOCOL (which Fly does under h2).
# Fly's proxy does not fulfil that tunnel and returns 502, so duels fail
# silently in every Chrome and Firefox session that has an open h2 connection
# to this host. Restricting ALPN prevents h2 negotiation entirely.
# See docs/adr/0004-fly-edge-serves-http1-only.md and the regression guard
# in scripts/smoke-artifact.mjs (remote mode).
[http_service.tls_options]
  alpn = ["http/1.1"]

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    path          = "/healthz"
    timeout       = "5s"

# ---------------------------------------------------------------------------
# Machine sizing — ~1 GB RAM (shared CPU)
# ---------------------------------------------------------------------------
[vm]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "1gb"
