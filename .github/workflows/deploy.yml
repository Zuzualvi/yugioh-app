name: Deploy

# Every push to master runs the verify gate, then (only if green) deploys:
#   • Fly backend  (api.zuhayr.io)  — flyctl remote build from Dockerfile
#   • Vercel frontend (app.zuhayr.io) — token-based `vercel deploy` (authorship-independent,
#     same model as the Fly backend). Vercel's Git integration is NOT used: it rejects
#     bot-authored commits (TEAM_ACCESS_REQUIRED), so the CLI + VERCEL_TOKEN is the
#     sole deployer.
# Secrets: FLY_API_TOKEN + BOOTSTRAP_ADMIN_* (backend), VERCEL_TOKEN + VERCEL_ORG_ID +
# VERCEL_PROJECT_ID (frontend). All set in repo Settings → Secrets (provision + CEO).

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  verify:
    name: verify (typecheck · lint · arch · actionlint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` context is NOT allowed in `if:` — hoist to job env, gate on env.
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
      - name: Notify Discord on verify failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **CI verify FAILED** on `master`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  accuracy:
    name: accuracy (Edison rules 1–6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # ── WASM cache ────────────────────────────────────────────────────────
      # Key: hash of build-wasm.sh (embeds EDO9300_COMMIT + build flags).
      # Stores emsdk toolchain (~290 MB) + ocgcore-wasm source + built artifacts.
      # Cold: ~10–15 min (emsdk download + em++ build). Cached: ~30 s restore.
      - name: Restore WASM build cache
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/engine/vendor/emsdk
            packages/engine/vendor/ocgcore-wasm-src
            packages/engine/vendor/ocgcore-custom.sync.mjs
            packages/engine/vendor/ocgcore-custom.sync.wasm
          key: wasm-v1-${{ hashFiles('packages/engine/scripts/build-wasm.sh') }}

      # ── Asset cache ───────────────────────────────────────────────────────
      # Key: hash of fetch-assets.sh (embeds BabelCDB + CardScripts commits).
      # Cold: ~1–2 min (git clone + cdb download). Cached: ~10 s restore.
      - name: Restore assets cache
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: packages/engine/assets
          key: assets-v1-${{ hashFiles('packages/engine/scripts/fetch-assets.sh') }}

      - name: Build WASM (skipped on cache hit)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/build-wasm.sh

      - name: Fetch assets (skipped on cache hit)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/fetch-assets.sh

      - name: Run Edison accuracy tests (Rules 1–6)
        run: npx vitest run packages/engine/src/edisonRules.accuracy.test.ts

  deploy-backend:
    name: deploy backend (Fly · api.zuhayr.io)
    needs: [verify, accuracy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-backend
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # ── Restore engine artifacts for Docker build context ─────────────────
      # The Dockerfile COPYs packages/engine/vendor/ and packages/engine/assets/.
      # Accuracy job already built + cached these; restore here so they exist
      # in the workspace before `flyctl deploy`. Build steps run only if the
      # cache somehow missed (e.g. first run or eviction).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Restore WASM build cache
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/engine/vendor/emsdk
            packages/engine/vendor/ocgcore-wasm-src
            packages/engine/vendor/ocgcore-custom.sync.mjs
            packages/engine/vendor/ocgcore-custom.sync.wasm
          key: wasm-v1-${{ hashFiles('packages/engine/scripts/build-wasm.sh') }}

      - name: Restore assets cache
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: packages/engine/assets
          key: assets-v1-${{ hashFiles('packages/engine/scripts/fetch-assets.sh') }}

      - name: Build WASM (fallback — should be a cache hit from accuracy job)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/build-wasm.sh

      - name: Fetch assets (fallback — should be a cache hit from accuracy job)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/fetch-assets.sh

      - name: Stage admin-bootstrap secrets (applied on next deploy)
        # Best-effort: if BOOTSTRAP_ADMIN_* secrets haven't been provisioned in the
        # repo yet (first-time setup, or CEO hasn't set them), flyctl rejects empty
        # values and would red the pipeline even though the deploy is fine.
        # We guard by only calling flyctl when both values are non-empty.
        run: |
          if [ -n "${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" ] && \
             [ -n "${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" ]; then
            flyctl secrets set --stage --app yugioh-app \
              BOOTSTRAP_ADMIN_USERNAME="${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" \
              BOOTSTRAP_ADMIN_PASSWORD="${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}"
          else
            echo "WARN: BOOTSTRAP_ADMIN_* secrets not set — skipping secrets staging (set them in repo Settings → Secrets)"
          fi

      # Preflight diagnostics (non-fatal) — surfaces flyctl version + app/machine
      # state in the run log to diagnose deploy failures we can't otherwise see.
      - name: Fly preflight diagnostics (non-fatal)
        run: |
          flyctl version || true
          flyctl status --app yugioh-app || true

      # ── MUST SUCCEED ──────────────────────────────────────────────────────────
      # This is the real deploy. A failure here means the image didn't land;
      # do NOT add || true or continue-on-error. --verbose surfaces the exact
      # remote-build / release step that fails.
      - name: Deploy image to Fly (remote build from Dockerfile)
        # --verbose surfaces the exact remote-build / release step in the run log.
        # The job's timeout-minutes:30 is the backstop — do NOT bound with a shorter
        # shell `timeout`; the first real image build + release legitimately takes
        # several minutes.
        run: flyctl deploy --remote-only --app yugioh-app --verbose

      # ── BEST-EFFORT (idempotent Fly housekeeping) ──────────────────────────
      # IPs and certs are already allocated after the first deploy; these are
      # no-ops thereafter. They can transiently fail (rate-limit, already-exists
      # error) without meaning the deploy is broken — hence || true.
      - name: Ensure public IPs (shared IPv4 + IPv6 are free)
        run: |
          flyctl ips allocate-v4 --shared --app yugioh-app || true
          flyctl ips allocate-v6 --app yugioh-app || true

      - name: Ensure TLS cert for the custom domain (idempotent)
        run: flyctl certs add api.zuhayr.io --app yugioh-app || true

      # ── BEST-EFFORT (post-deploy image seed) ──────────────────────────────
      # `flyctl ssh console` is inherently flaky: the Fly machine may still be
      # starting up after the deploy, the SSH handshake can time out, or the
      # builder VM may not be reachable yet. These are transient — the deploy
      # itself already succeeded. We retry 3×/15 s and treat ultimate failure as
      # a warning rather than a broken pipeline. Re-run manually if images are
      # missing: `flyctl ssh console --app yugioh-app -C "node /app/deploy/seed-images.mjs"`
      - name: Seed card images onto the volume (idempotent — fast no-op once seeded)
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Seed attempt $attempt/3…"
            flyctl ssh console --app yugioh-app -C "node /app/deploy/seed-images.mjs" && break
            if [ $attempt -lt 3 ]; then
              echo "SSH failed — waiting 20 s before retry…"
              sleep 20
            else
              echo "WARN: image seeding failed after 3 attempts — deploy is still live; seed manually if needed"
            fi
          done

      - name: Notify Discord on deploy failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **Backend deploy FAILED** on `master`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy-frontend:
    name: deploy frontend (Vercel)
    needs: [verify, accuracy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-frontend
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel (preview — remote build)
        id: deploy
        run: |
          set -o pipefail
          url=$(vercel deploy --token="$VERCEL_TOKEN" --yes | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel preview deployment"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **Frontend deploy FAILED** on `master`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
