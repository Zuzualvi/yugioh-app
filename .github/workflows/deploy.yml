name: Deploy

# Every push to master runs the verify gate, then (only if green) deploys:
#   • Fly backend  (api.zuhayr.io)  — flyctl remote build from Dockerfile
#   • Vercel frontend (app.zuhayr.io) — token-based `vercel build` then `vercel deploy --prebuilt`
#     Vercel's Git integration is NOT used, but that never made the CLI authorship-blind:
#     `vercel deploy` reads .git from THIS checkout and attaches the commit author to the
#     deployment, and the Hobby plan BLOCKS any deployment whose author is not a
#     recognised collaborator — the build is never queued, so the CLI waits forever and
#     the job dies on timeout. That is why deploy-frontend deletes .git below. Verified
#     22/22 across this project's deployment history. The CLI + VERCEL_TOKEN is
#     the sole deployer. The build runs on the GH runner deliberately — see the deploy-frontend
#     job for why a remote build made the deploy's outcome unobservable.
# Secrets: FLY_API_TOKEN + BOOTSTRAP_ADMIN_* (backend), VERCEL_TOKEN + VERCEL_ORG_ID +
# VERCEL_PROJECT_ID (frontend). All set in repo Settings → Secrets (provision + CEO).

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  verify:
    name: verify (typecheck · lint · arch · actionlint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` context is NOT allowed in `if:` — hoist to job env, gate on env.
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
      - name: Notify Discord on verify failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **CI verify FAILED** on `master`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ── The gate that watches what actually ships ──────────────────────────────
  # `verify` above exercises packages/server/src/app.ts. NOTHING DEPLOYS app.ts:
  # the Dockerfile bundles prod-server.ts with esbuild, which neither typechecks
  # nor executes it. On 2026-07-28 that gap took production down while every gate
  # in this repo was green.
  #
  # This job builds the real bundle, boots it, and asserts its full route table
  # plus both WebSocket upgrade paths. deploy-backend below NEEDS it, so a bundle
  # that does not serve its routes cannot reach api.zuhayr.io. Running this only
  # as a PR check would leave master free to deploy a broken artifact and report
  # the failure afterwards — which is exactly what happened.
  artifact-smoke:
    name: artifact smoke (boots the shipped bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` context is NOT allowed in `if:` — hoist to job env, gate on env.
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # No WASM needed: the engine is bundled but only loads its WASM once a duel
      # actually starts, so the bundle boots and serves every route without it.
      - run: npm run smoke:artifact
      - name: Notify Discord on artifact smoke failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **ARTIFACT SMOKE FAILED** on `master` — backend deploy BLOCKED
            The shipped bundle does not serve its expected routes.
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  accuracy:
    name: accuracy (Edison full parity matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # ── WASM cache ────────────────────────────────────────────────────────
      # Key: hash of build-wasm.sh (embeds EDO9300_COMMIT + build flags).
      # Stores emsdk toolchain (~290 MB) + ocgcore-wasm source + built artifacts.
      # Cold: ~10–15 min (emsdk download + em++ build). Cached: ~30 s restore.
      - name: Restore WASM build cache
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/engine/vendor/emsdk
            packages/engine/vendor/ocgcore-wasm-src
            packages/engine/vendor/ocgcore-custom.sync.mjs
            packages/engine/vendor/ocgcore-custom.sync.wasm
          key: wasm-v1-${{ hashFiles('packages/engine/scripts/build-wasm.sh') }}

      # ── Asset cache ───────────────────────────────────────────────────────
      # Key: hash of fetch-assets.sh (embeds BabelCDB + CardScripts commits).
      # Cold: ~1–2 min (git clone + cdb download). Cached: ~10 s restore.
      - name: Restore assets cache
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: packages/engine/assets
          key: assets-v1-${{ hashFiles('packages/engine/scripts/fetch-assets.sh') }}

      - name: Build WASM (skipped on cache hit)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/build-wasm.sh

      - name: Fetch assets (skipped on cache hit)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/fetch-assets.sh

      - name: Run Edison accuracy suite (full parity matrix)
        # Full parity matrix: every *.accuracy.test.ts + the Tier-3 fixture loader.
        # A glob so newly-added accuracy files are gated automatically. Uses the
        # repo-local vitest binary (npx can resolve a different major and break).
        run: node_modules/.bin/vitest run packages/engine/src/*.accuracy.test.ts packages/engine/src/edisonFixtures.load.test.ts

  deploy-backend:
    name: deploy backend (Fly · api.zuhayr.io)
    needs: [verify, artifact-smoke, accuracy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-backend
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # ── Restore engine artifacts for Docker build context ─────────────────
      # The Dockerfile COPYs packages/engine/vendor/ and packages/engine/assets/.
      # Accuracy job already built + cached these; restore here so they exist
      # in the workspace before `flyctl deploy`. Build steps run only if the
      # cache somehow missed (e.g. first run or eviction).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Restore WASM build cache
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/engine/vendor/emsdk
            packages/engine/vendor/ocgcore-wasm-src
            packages/engine/vendor/ocgcore-custom.sync.mjs
            packages/engine/vendor/ocgcore-custom.sync.wasm
          key: wasm-v1-${{ hashFiles('packages/engine/scripts/build-wasm.sh') }}

      - name: Restore assets cache
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: packages/engine/assets
          key: assets-v1-${{ hashFiles('packages/engine/scripts/fetch-assets.sh') }}

      - name: Build WASM (fallback — should be a cache hit from accuracy job)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/build-wasm.sh

      - name: Fetch assets (fallback — should be a cache hit from accuracy job)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/fetch-assets.sh

      - name: Stage admin-bootstrap secrets (applied on next deploy)
        # Best-effort: if BOOTSTRAP_ADMIN_* secrets haven't been provisioned in the
        # repo yet (first-time setup, or CEO hasn't set them), flyctl rejects empty
        # values and would red the pipeline even though the deploy is fine.
        # We guard by only calling flyctl when both values are non-empty.
        run: |
          if [ -n "${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" ] && \
             [ -n "${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" ]; then
            flyctl secrets set --stage --app yugioh-app \
              BOOTSTRAP_ADMIN_USERNAME="${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" \
              BOOTSTRAP_ADMIN_PASSWORD="${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}"
          else
            echo "WARN: BOOTSTRAP_ADMIN_* secrets not set — skipping secrets staging (set them in repo Settings → Secrets)"
          fi

      # Preflight diagnostics (non-fatal) — surfaces flyctl version + app/machine
      # state in the run log to diagnose deploy failures we can't otherwise see.
      - name: Fly preflight diagnostics (non-fatal)
        run: |
          flyctl version || true
          flyctl status --app yugioh-app || true

      # ── MUST SUCCEED ──────────────────────────────────────────────────────────
      # This is the real deploy. A failure here means the image didn't land;
      # do NOT add || true or continue-on-error. --verbose surfaces the exact
      # remote-build / release step that fails.
      - name: Deploy image to Fly (remote build from Dockerfile)
        # --verbose surfaces the exact remote-build / release step in the run log.
        # The job's timeout-minutes:30 is the backstop — do NOT bound with a shorter
        # shell `timeout`; the first real image build + release legitimately takes
        # several minutes.
        run: flyctl deploy --remote-only --app yugioh-app --verbose

      # ── BEST-EFFORT (idempotent Fly housekeeping) ──────────────────────────
      # IPs and certs are already allocated after the first deploy; these are
      # no-ops thereafter. They can transiently fail (rate-limit, already-exists
      # error) without meaning the deploy is broken — hence || true.
      - name: Ensure public IPs (shared IPv4 + IPv6 are free)
        run: |
          flyctl ips allocate-v4 --shared --app yugioh-app || true
          flyctl ips allocate-v6 --app yugioh-app || true

      - name: Ensure TLS cert for the custom domain (idempotent)
        run: flyctl certs add api.zuhayr.io --app yugioh-app || true

      # ── BEST-EFFORT (post-deploy image seed) ──────────────────────────────
      # `flyctl ssh console` is inherently flaky: the Fly machine may still be
      # starting up after the deploy, the SSH handshake can time out, or the
      # builder VM may not be reachable yet. These are transient — the deploy
      # itself already succeeded. We retry 3×/15 s and treat ultimate failure as
      # a warning rather than a broken pipeline. Re-run manually if images are
      # missing: `flyctl ssh console --app yugioh-app -C "node /app/deploy/seed-images.mjs"`
      - name: Seed card images onto the volume (idempotent — fast no-op once seeded)
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Seed attempt $attempt/3…"
            flyctl ssh console --app yugioh-app -C "node /app/deploy/seed-images.mjs" && break
            if [ $attempt -lt 3 ]; then
              echo "SSH failed — waiting 20 s before retry…"
              sleep 20
            else
              echo "WARN: image seeding failed after 3 attempts — deploy is still live; seed manually if needed"
            fi
          done

      - name: Notify Discord on deploy failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **Backend deploy FAILED** on `master`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy-frontend:
    name: deploy frontend (Vercel · app.zuhayr.io — production)
    needs: [verify, accuracy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-frontend
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Drop git metadata (the deploy must not be author-gated)
        # `vercel deploy` reads .git from the checkout and attaches the commit author.
        # Vercel's Hobby plan blocks any deployment whose author is not a recognised
        # collaborator, and a commit written through the GitHub API — which is the ONLY
        # way to change a workflow file here — is authored
        # `...@users.noreply.github.com`. With no .git there is no author to gate on.
        # Deliberately tool-agnostic: it holds for git push, the API, a merge, or any
        # write path added later, instead of every path having to get authorship right
        # forever. Cost: the Vercel dashboard loses commit/branch annotation. Actions
        # already has it.
        run: rm -rf .git
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (local — Vite on the GH runner, output to .vercel/output/)
        # Runs packages/web/vercel.json's buildCommand HERE, not on Vercel. The log is
        # visible line by line and a build failure exits non-zero immediately.
        #
        # This replaces `vercel deploy --prod`, which triggered a REMOTE build and blocked
        # the CLI for ~14 minutes with no output — silently consuming almost the entire
        # 15-minute budget. Runs #68, #72 and #73 all died at 15m14-16s that way, and the
        # previous session read the resulting CANCELLED as a broken Vercel config. It was
        # a timeout. Worse, the remote build could still finish AFTER the runner was killed,
        # so a cancelled job did not even mean the deploy had failed — the outcome was
        # unobservable, which is the actual defect being fixed here.
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt artifact to Vercel (production)
        # Rollback: vercel rollback <deployment-url> --token=$VERCEL_TOKEN  (or Vercel dashboard → Instant Rollback)
        # --prebuilt uploads .vercel/output/ only. No remote build, so this returns once the
        # deployment is actually live: the job is green IFF the deploy landed AND the health
        # check passed, with no asynchronous step that can outlive the runner.
        id: deploy
        run: |
          set -o pipefail
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel production deployment"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Health check (production domain)
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/body.html -w '%{http_code}' --max-time 30 https://app.zuhayr.io || echo 000)
            echo "attempt $attempt: GET https://app.zuhayr.io -> $code"
            if [ "$code" = "200" ] && grep -q 'id="root"' /tmp/body.html; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check FAILED: app.zuhayr.io did not return a 200 SPA shell after retries"
          exit 1
      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **Frontend deploy FAILED** on `master`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
