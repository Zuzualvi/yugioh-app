name: Deploy

# merge=deploy for the BACKEND only. The Vercel frontend (app.zuhayr.io) is deployed
# by Vercel's own Git integration on push (it uses the project's VITE_* env vars), so
# there is deliberately no frontend job here — a second CLI deployer fought with it.
#
# Every push to master runs the verify gate, then (only if green) deploys the Fly
# backend (api.zuhayr.io) and seeds card images onto the volume.
# Secrets FLY_API_TOKEN + BOOTSTRAP_ADMIN_* are set in the repo (provision + CEO).

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  verify:
    name: verify (typecheck · lint · arch · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify

  deploy-backend:
    name: deploy backend (Fly · api.zuhayr.io)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage admin-bootstrap secrets (applied on next deploy)
        run: |
          flyctl secrets set --stage --app yugioh-app \
            BOOTSTRAP_ADMIN_USERNAME="${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}" \
            BOOTSTRAP_ADMIN_PASSWORD="${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}"
      - name: Deploy image to Fly (remote build from Dockerfile)
        run: flyctl deploy --remote-only --app yugioh-app
      - name: Ensure public IPs (shared IPv4 + IPv6 are free)
        run: |
          flyctl ips allocate-v4 --shared --app yugioh-app || true
          flyctl ips allocate-v6 --app yugioh-app || true
      - name: Ensure TLS cert for the custom domain (idempotent)
        run: flyctl certs add api.zuhayr.io --app yugioh-app || true
      - name: Seed card images onto the volume (idempotent — fast no-op once seeded)
        run: flyctl ssh console --app yugioh-app -C "node /app/deploy/seed-images.mjs"
