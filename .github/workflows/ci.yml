name: CI

# Verify gate for pull requests. Pushes to master are gated by the `verify` job
# in deploy.yml (merge=deploy), so this workflow only runs on PRs to avoid
# duplicate runs. Same steps as `npm run verify`.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    name: typecheck · lint · arch · actionlint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` context is NOT allowed in `if:` — hoist to job env, gate on env.
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
      - name: Notify Discord on CI failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **CI FAILED** on PR #${{ github.event.pull_request.number }}
            Branch: `${{ github.head_ref }}`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  accuracy:
    name: accuracy (Edison full parity matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # ── WASM cache ────────────────────────────────────────────────────────
      # Key: hash of build-wasm.sh (embeds EDO9300_COMMIT + build flags).
      # Stores emsdk toolchain (~290 MB) + ocgcore-wasm source + built artifacts.
      # Cold: ~10–15 min (emsdk download + em++ build). Cached: ~30 s restore.
      - name: Restore WASM build cache
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/engine/vendor/emsdk
            packages/engine/vendor/ocgcore-wasm-src
            packages/engine/vendor/ocgcore-custom.sync.mjs
            packages/engine/vendor/ocgcore-custom.sync.wasm
          key: wasm-v1-${{ hashFiles('packages/engine/scripts/build-wasm.sh') }}

      # ── Asset cache ───────────────────────────────────────────────────────
      # Key: hash of fetch-assets.sh (embeds BabelCDB + CardScripts commits).
      # Cold: ~1–2 min (git clone + cdb download). Cached: ~10 s restore.
      - name: Restore assets cache
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: packages/engine/assets
          key: assets-v1-${{ hashFiles('packages/engine/scripts/fetch-assets.sh') }}

      - name: Build WASM (skipped on cache hit)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/build-wasm.sh

      - name: Fetch assets (skipped on cache hit)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/fetch-assets.sh

      - name: Run Edison accuracy suite (full parity matrix)
        # Full parity matrix: every *.accuracy.test.ts + the Tier-3 fixture loader.
        # A glob so newly-added accuracy files are gated automatically. Uses the
        # repo-local vitest binary (npx can resolve a different major and break).
        run: node_modules/.bin/vitest run packages/engine/src/*.accuracy.test.ts packages/engine/src/edisonFixtures.load.test.ts
