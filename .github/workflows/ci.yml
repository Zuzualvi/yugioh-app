name: CI

# Verify gate for pull requests. Pushes to master are gated by the `verify` job
# in deploy.yml (merge=deploy), so this workflow only runs on PRs to avoid
# duplicate runs. Same steps as `npm run verify`.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    name: typecheck · lint · arch · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify
