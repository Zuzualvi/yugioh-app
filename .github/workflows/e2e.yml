name: E2E

# Proves the live 2-player duel BACKBONE end-to-end (Playwright) on a same-origin
# localhost stack that boots the real WASM engine + duel WS + SPA (see
# e2e/harness/server.ts). Its own workflow so it gives an independent green/red
# signal without entangling the deploy path. "Verified" = this job green.

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # PRs get this suite too, and the branch list is an ALLOWLIST — a PR into a
  # branch not named here runs zero checks, silently, because a PR with no checks
  # looks much like a PR with passing ones.
  #
  # integration/* is here for the reason this trigger was added at all. The
  # pre-duel room was built across five slices on integration/duel-room, and this
  # workflow only ever ran on push to master — so the browser suite never saw the
  # feature until the cutover merge, at which point duel.spec.ts turned out to be
  # driving a flow the feature had deleted, and the harness turned out to be
  # silently dropping every WebSocket upgrade. Both were findable weeks earlier by
  # exactly this job. A feature must not be able to reach completion unseen by it.
  #
  # If you add an integration branch, the glob below already covers integration/*.
  pull_request:
    branches: [master, "integration/*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Supersede in-flight runs for the same ref. Without this, every push to a PR
# paid for a full run of work already obsolete — including the 30-minute
# accuracy job in ci.yml. Keyed by workflow+ref so master and each PR queue
# independently. Note deploy.yml is deliberately NOT given this treatment: a
# cancelled deploy is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (live duel backbone · Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      # ── Engine WASM + card assets (same cache keys as deploy.yml `accuracy`
      #    job → warm reuse; build only on a cache miss). ──────────────────────
      - name: Restore WASM build cache
        id: cache-wasm
        uses: actions/cache@v4
        with:
          path: |
            packages/engine/vendor/emsdk
            packages/engine/vendor/ocgcore-wasm-src
            packages/engine/vendor/ocgcore-custom.sync.mjs
            packages/engine/vendor/ocgcore-custom.sync.wasm
          key: wasm-v1-${{ hashFiles('packages/engine/scripts/build-wasm.sh') }}
      - name: Restore assets cache
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: packages/engine/assets
          key: assets-v1-${{ hashFiles('packages/engine/scripts/fetch-assets.sh') }}
      - name: Build WASM (skipped on cache hit)
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/build-wasm.sh
      - name: Fetch assets (skipped on cache hit)
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash packages/engine/scripts/fetch-assets.sh

      # ── Playwright chromium (cache keyed by installed Playwright version). ───
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      - name: Build web SPA
        run: npm run build:web

      # ── Run Playwright; tee all output (including harness server stderr that
      #    Playwright captures from webServer.stderr:"pipe") to a log file so the
      #    failure dump step below can print it at the log TAIL regardless of how
      #    many lines of post-job cleanup follow. The JSON reporter writes a
      #    machine-readable summary for the structured dump step. ───────────────
      - name: Run live duel E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/pw-results.json
        run: |
          npx playwright test e2e/playwright/duel.spec.ts --reporter=list,json \
            2>&1 | tee /tmp/pw-run.log
          exit ${PIPESTATUS[0]}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Notify Discord on E2E failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            ❌ **E2E FAILED** on `${{ github.head_ref || github.ref_name }}`
            Commit: `${{ github.sha }}` by ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ── MUST BE LAST STEP — failure diagnostics printed at the log TAIL ─────
      # Why this exists: the only view some readers have of a run is the TAIL of
      # the job log, and the tail is normally post-job git cleanup plus a Node
      # deprecation warning. The actual Playwright failure — which spec step,
      # which selector, expected vs actual — sits far above that and was
      # effectively invisible. Three rounds of guessing at a duel-UI E2E failure
      # were spent on exactly this before the step below was added.
      #
      # It re-surfaces what Playwright already printed so it lands where it can
      # be read. Keep it LAST.
      - name: "⛔ E2E failure dump (log tail rescue)"
        if: failure()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  E2E FAILURE DUMP — scroll no further, the error is here"
          echo "════════════════════════════════════════════════════════════"

          # ── Full Playwright + harness output (last 300 lines) ──────────────
          # Playwright's webServer captures harness stdout/stderr (configured
          # with stdout:"pipe", stderr:"pipe") and prints them on failure, so
          # WASM-not-found errors and other server-side crashes appear here too.
          echo ""
          echo "=== Playwright + harness output (last 300 lines) ==="
          if [ -f /tmp/pw-run.log ]; then
            tail -n 300 /tmp/pw-run.log
          else
            echo "(pw-run.log missing — the E2E step may not have reached Playwright)"
          fi

          # ── Structured summary from JSON reporter ──────────────────────────
          echo ""
          echo "=== Structured failure summary (test name · selector · expected/actual) ==="
          if [ -f test-results/pw-results.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('test-results/pw-results.json', 'utf8'));
              const stats = r.stats || {};
              console.log('Stats: ' + (stats.expected||0) + ' passed, ' + (stats.unexpected||0) + ' failed, ' + (stats.skipped||0) + ' skipped');
              function walk(suite) {
                (suite.specs || []).forEach(sp => {
                  (sp.tests || []).filter(t => t.status !== 'expected').forEach(t => {
                    console.log('\nFAIL [' + t.projectName + '] ' + sp.file + ':' + sp.line + ' > ' + sp.title);
                    (t.results || []).forEach(res => {
                      if (res.error) {
                        console.log('  Error   : ' + (res.error.message || JSON.stringify(res.error)).split('\n')[0]);
                        if (res.error.snippet) console.log('  Snippet : ' + res.error.snippet.trim().split('\n').slice(0, 6).join('\n            '));
                        if (res.error.stack)   console.log('  Stack   : ' + res.error.stack.trim().split('\n').slice(0, 5).join('\n            '));
                      }
                    });
                  });
                });
                (suite.suites || []).forEach(walk);
              }
              walk(r);
            " 2>/dev/null || echo "(JSON parse failed — see tee output above)"
          else
            echo "(test-results/pw-results.json not found — check if the E2E step ran at all)"
          fi

          echo ""
          echo "════════════════════════════════════════════════════════════"
